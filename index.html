<body>
  <!-- Hidden form for Netlify Forms detection -->
  <form name="voice-assist-inquiry" netlify netlify-honeypot="bot-field" hidden>

  <div id="root">
    <div style="text-align: center; padding: 50px; color: white;">Loading...</div>
  </div>
  <script type="module">
    import React from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
    import { GoogleGenAI, Modality } from 'https://esm.sh/@google/genai@1.39.0';

    // Helper to resample audio input to 16kHz
    const resampleFloat32 = (input, inRate, outRate) => {
      if (inRate === outRate) return input;
      const ratio = inRate / outRate;
      const newLength = Math.round(input.length / ratio);
      const out = new Float32Array(newLength);
      for (let i = 0; i < newLength; i++) {
        const idx = i * ratio;
        const idx0 = Math.floor(idx);
        const idx1 = Math.min(idx0 + 1, input.length - 1);
        const frac = idx - idx0;
        out[i] = input[idx0] * (1 - frac) + input[idx1] * frac;
      }
      return out;
    };

    const BRAND_NAME = "West LA Computer Expert";
    const BUSINESS_PHONE = "310-850-8093";
    const OWNER_NAME = "Daniel Zivetz";
    const SYSTEM_INSTRUCTION = `You are a helpful voice assistant for West LA Computer Expert, owned by Daniel Zivetz. 
Your job is to collect support ticket information from callers. Be friendly and conversational.

CRITICAL: Whenever you receive ANY information from the caller, you MUST call the sync_triage_form function to update the form.
This includes:
- Initial information when first provided
- CORRECTIONS to previously given information (always call sync_triage_form with the corrected value)
- Any updates or changes the caller requests

Ask for: their name, phone number, email address (mention they can type it in the form if easier), 
whether they are a business or personal user, their business name (if applicable), 
the urgency level (Low, Medium, High, Critical), and a brief summary of their issue.

IMPORTANT: When asking for email, say something like "What's your email address? You can also type it directly in the form on the right if that's easier."

If the caller corrects any information, acknowledge it AND call sync_triage_form with the corrected value immediately.
After collecting all information, confirm the details with the caller.`;

    const TRIAGE_TOOL = {
      name: 'sync_triage_form',
      description: 'Updates the triage intake form with information provided by the caller',
      parameters: {
        type: 'object',
        properties: {
          clientName: { type: 'string', description: 'The caller\'s name' },
          phone: { type: 'string', description: 'The caller\'s phone number' },
          email: { type: 'string', description: 'The caller\'s email address' },
          userType: { type: 'string', description: 'Business or Personal' },
          businessName: { type: 'string', description: 'Name of their business if applicable' },
          urgency: { type: 'string', description: 'Low, Medium, High, or Critical' },
          summary: { type: 'string', description: 'Brief summary of the issue' }
        }
      }
    };

    const App = () => {
      const [status, setStatus] = React.useState('IDLE');
      const [error, setError] = React.useState('');
      const [formData, setFormData] = React.useState({ clientName: '', phone: '', email: '', userType: '', businessName: '', urgency: 'Medium', summary: '' });
      const [transcript, setTranscript] = React.useState([]);
      const [submitted, setSubmitted] = React.useState(false);
      const [isSpeaking, setIsSpeaking] = React.useState(false);
      const [rms, setRms] = React.useState(0);
      const [apiKey, setApiKey] = React.useState(window.GEMINI_API_KEY || localStorage.getItem('gemini_api_key') || '');
      const [showApiInput, setShowApiInput] = React.useState(!window.GEMINI_API_KEY && !localStorage.getItem('gemini_api_key'));

      const saveApiKey = (key) => {
        localStorage.setItem('gemini_api_key', key);
        setApiKey(key);
        setShowApiInput(false);
        window.process.env.API_KEY = key;
      };

      const sessionRef = React.useRef(null);
      const audioContextRef = React.useRef(null);
      const audioQueueRef = React.useRef([]);
      const isPlayingRef = React.useRef(false);
      const speechRecognitionRef = React.useRef(null);

      const playNextAudio = async () => {
        if (isPlayingRef.current || audioQueueRef.current.length === 0) return;
        isPlayingRef.current = true;
        const audioData = audioQueueRef.current.shift();
        try {
          if (!audioContextRef.current || audioContextRef.current.state === 'closed') {
            audioContextRef.current = new AudioContext();
          }
          const ctx = audioContextRef.current;
          if (ctx.state === 'suspended') await ctx.resume();
          const binaryString = atob(audioData);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          const int16Data = new Int16Array(bytes.buffer);
          const floatData = new Float32Array(int16Data.length);
          for (let i = 0; i < int16Data.length; i++) {
            floatData[i] = int16Data[i] / 32768;
          }
          const audioBuffer = ctx.createBuffer(1, floatData.length, 24000);
          audioBuffer.copyToChannel(floatData, 0);
          const source = ctx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(ctx.destination);
          source.onended = () => {
            isPlayingRef.current = false;
            playNextAudio();
          };
          source.start();
        } catch (e) {
          console.error('Audio playback error:', e);
          isPlayingRef.current = false;
          playNextAudio();
        }
      };

      const addToTranscript = (role, text) => {
        setTranscript(prev => [...prev, { role, text, time: new Date().toLocaleTimeString() }]);
      };

      const start = async () => {
        try {
          if (sessionRef.current) {
            try { sessionRef.current.close(); } catch (e) { }
            sessionRef.current = null;
          }
          setStatus('CONNECTING');
          setError('');
          setTranscript([]);
          setSubmitted(false);

          const apiKey = window.process?.env?.API_KEY;
          if (!apiKey) {
            throw new Error('API key not found');
          }

          audioContextRef.current = new AudioContext();
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
          const ai = new GoogleGenAI({ apiKey });

          const session = await ai.live.connect({
            model: 'gemini-2.5-flash-native-audio-preview-12-2025',
            callbacks: {
              onopen: () => {
                console.log('CONNECTED!');
                setStatus('CONNECTED');

                // Start browser speech recognition for transcript
                try {
                  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.continuous = true;
                    recognition.interimResults = false;
                    recognition.lang = 'en-US';
                    recognition.onresult = (event) => {
                      for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                          const text = event.results[i][0].transcript.trim();
                          if (text) {
                            addToTranscript('user', text);
                          }
                        }
                      }
                    };
                    recognition.onerror = (e) => console.log('Speech recognition error:', e.error);
                    recognition.onend = () => {
                      // Restart if still connected
                      if (sessionRef.current) {
                        try { recognition.start(); } catch (e) { }
                      }
                    };
                    recognition.start();
                    speechRecognitionRef.current = recognition;
                  }
                } catch (e) {
                  console.log('Speech recognition not available');
                }

                setTimeout(() => {
                  try {
                    const audioContext = new AudioContext();
                    const source = audioContext.createMediaStreamSource(stream);
                    const processor = audioContext.createScriptProcessor(2048, 1, 1);
                    processor.onaudioprocess = (e) => {
                      const input = e.inputBuffer.getChannelData(0);
                      let sum = 0;
                      for (let i = 0; i < input.length; i++) sum += Math.abs(input[i]);
                      const avg = sum / input.length;
                      setRms(avg);
                      setIsSpeaking(avg > 0.02);

                      // Resample dynamically based on actual input context sample rate to 16000Hz
                      const resampled = resampleFloat32(input, audioContext.sampleRate, 16000);

                      // Convert to Int16 PCM
                      const int16 = new Int16Array(resampled.length);
                      for (let i = 0; i < resampled.length; i++) {
                        int16[i] = Math.max(-32768, Math.min(32767, resampled[i] * 32768));
                      }
                      
                      // Convert to Base64 in safe chunks
                      const u8 = new Uint8Array(int16.buffer);
                      let CHUNK = 0x8000;
                      let idx = 0;
                      let binary = '';
                      while (idx < u8.length) {
                        const slice = u8.subarray(idx, Math.min(idx + CHUNK, u8.length));
                        binary += String.fromCharCode.apply(null, slice);
                        idx += CHUNK;
                      }
                      const base64 = btoa(binary);

                      try {
                        session.sendRealtimeInput({ audio: { data: base64, mimeType: 'audio/pcm;rate=16000' } });
                      } catch (err) {
                        console.error('Send error:', err);
                      }
                    };
                    source.connect(processor);
                    processor.connect(audioContext.destination);
                  } catch (err) {
                    console.error('Audio setup error:', err);
                  }
                }, 1000);
              },
              onmessage: (message) => {
                console.log('Received message:', message);

                // Handle tool calls for form filling
                if (message.toolCall?.functionCalls) {
                  const functionResponses = [];
                  message.toolCall.functionCalls.forEach(fc => {
                    if (fc.name === 'sync_triage_form') {
                      console.log('Form update:', fc.args);
                      setFormData(prev => ({ ...prev, ...fc.args }));
                      // Add user's spoken info to transcript
                      const args = fc.args;
                      if (args.clientName) addToTranscript('user', `My name is ${args.clientName}`);
                      if (args.phone) addToTranscript('user', `Phone: ${args.phone}`);
                      if (args.email) addToTranscript('user', `Email: ${args.email}`);
                      if (args.userType) addToTranscript('user', `I'm a ${args.userType}`);
                      if (args.businessName) addToTranscript('user', `Business: ${args.businessName}`);
                      if (args.summary) addToTranscript('user', `Issue: ${args.summary}`);
                      if (args.urgency) addToTranscript('user', `Priority: ${args.urgency}`);
                    }
                    // Always send a response for every function call
                    functionResponses.push({
                      id: fc.id,
                      name: fc.name,
                      response: { result: 'success' }
                    });
                  });
                  // Send tool responses to continue conversation
                  if (functionResponses.length > 0 && sessionRef.current) {
                    setTimeout(() => {
                      try {
                        sessionRef.current.sendToolResponse({ functionResponses });
                        console.log('Tool response sent');
                      } catch (err) {
                        console.error('Tool response error:', err);
                      }
                    }, 100);
                  }
                }

                if (message.serverContent?.modelTurn?.parts) {
                  for (const part of message.serverContent.modelTurn.parts) {
                    if (part.text) {
                      // Filter out internal AI reasoning/notes (but show normal responses)
                      const text = part.text;
                      const isInternalNote =
                        text.startsWith('**') ||
                        text.includes('My programming compels') ||
                        text.includes('Acknowledge and Initiate') ||
                        text.includes("I've successfully updated") ||
                        text.includes("I am in the process of") ||
                        text.includes("I've registered") ||
                        text.includes("My next task") ||
                        text.includes("My next action") ||
                        text.includes("I'll utilize") ||
                        text.includes("sync_triage_form") ||
                        text.includes("I've noted") ||
                        text.includes("triage form") ||
                        text.includes("form is ready");
                      if (!isInternalNote && text.trim().length > 0) {
                        addToTranscript('assistant', text);
                      }
                    }
                    if (part.inlineData?.data) {
                      audioQueueRef.current.push(part.inlineData.data);
                      playNextAudio();
                    }
                  }
                }
                if (message.serverContent?.inputTranscription) {
                  addToTranscript('user', message.serverContent.inputTranscription);
                }
                if (message.serverContent?.outputTranscription) {
                  addToTranscript('assistant', message.serverContent.outputTranscription);
                }
                // Debug: log all serverContent keys to find transcription fields
                if (message.serverContent) {
                  console.log('serverContent keys:', Object.keys(message.serverContent));
                  console.log('serverContent:', JSON.stringify(message.serverContent, null, 2).substring(0, 500));
                }
              },
              onerror: (e) => {
                console.error('Session error:', e);
                setError('Connection error: ' + (e.message || 'Unknown error'));
                setStatus('IDLE');
              },
              onclose: (e) => {
                console.log('Session closed:', e);
                const code = e?.code || '';
                if (code === 429 || String(e).includes('429')) {
                  setError('Quota Exceeded (429). Please wait 60 seconds.');
                } else if (code === 403 || String(e).includes('403')) {
                  setError('Permission Denied (403). Check API key restrictions.');
                } else {
                  setError('Connection closed: ' + (e?.reason || 'Unknown'));
                }
                setStatus('IDLE');
              }
            },
            config: {
              responseModalities: [Modality.AUDIO],
              systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
              tools: [{ functionDeclarations: [TRIAGE_TOOL] }]
            }
          });

          sessionRef.current = session;
        } catch (err) {
          console.error('Start error:', err);
          setError(err.message || 'Failed to start');
          setStatus('IDLE');
        }
      };

      const stop = () => {
        if (sessionRef.current) {
          try { sessionRef.current.close(); } catch (e) { }
          sessionRef.current = null;
        }
        if (speechRecognitionRef.current) {
          try { speechRecognitionRef.current.stop(); } catch (e) { }
          speechRecognitionRef.current = null;
        }
        setStatus('IDLE');
      };

      const handleSubmit = async () => {
        console.log('Form submitted:', formData);

        // Format the transcript for the Netlify Form submission
        const formattedTranscript = transcript
          .map(t => `[${t.time}] ${t.role.toUpperCase()}: ${t.text}`)
          .join('\n');

        // Submit to Netlify Forms
        try {
          const formBody = new URLSearchParams({
            'form-name': 'voice-assist-inquiry',
            'bot-field': '',
            'clientName': formData.clientName || '',
            'phone': formData.phone || '',
            'email': formData.email || '',
            'userType': formData.userType || '',
            'businessName': formData.businessName || '',
            'urgency': formData.urgency || 'Medium',
            'summary': formData.summary || '',
            'transcript': formattedTranscript || 'No voice transcript recorded.'
          });

          await fetch('/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formBody.toString()
          });

          console.log('Submitted to Netlify Forms');
        } catch (err) {
          console.error('Form submission error:', err);
        }

        setSubmitted(true);
      };

      // Create the UI using React.createElement
      const e = React.createElement;

      // API Key input modal
      if (showApiInput) {
        return e('div', { className: 'min-h-screen flex items-center justify-center p-4' },
          e('div', { className: 'glass rounded-3xl p-8 max-w-md w-full text-center' },
            e('h2', { className: 'text-2xl font-bold mb-4' }, '🔑 Enter API Key'),
            e('p', { className: 'text-gray-400 mb-6 text-sm' },
              'Enter your Google Gemini API key to use the voice assistant. Your key is stored locally and never sent to our servers.'),
            e('input', {
              type: 'password',
              placeholder: 'AIza...',
              className: 'w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white mb-4 focus:outline-none focus:border-sky-500',
              id: 'apiKeyInput'
            }),
            e('button', {
              className: 'w-full py-3 bg-sky-500 hover:bg-sky-600 rounded-xl font-bold transition-colors',
              onClick: () => {
                const input = document.getElementById('apiKeyInput');
                if (input.value.trim()) {
                  saveApiKey(input.value.trim());
                }
              }
            }, 'Save API Key'),
            e('p', { className: 'text-gray-500 text-xs mt-4' },
              'Get your API key from Google AI Studio')
          )
        );
      }

      return e('div', { className: 'min-h-screen p-4 md:p-8 flex items-center justify-center relative overflow-hidden' },
        // Background glow
        e('div', { className: 'absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_50%_50%,#0ea5e915,transparent_70%)] pointer-events-none' }),

        e('div', { className: 'w-full max-w-5xl z-10' },
          // Header
          e('header', { className: 'text-center mb-10' },
            e('h1', { className: 'text-4xl md:text-6xl font-black mb-2 flex items-center justify-center gap-3 italic' },
              'West LA ', e('span', { className: 'text-sky-500 not-italic' }, 'Concierge')
            ),
            e('p', { className: 'text-gray-400 font-medium tracking-widest uppercase text-sm' },
              `${OWNER_NAME} • ${BUSINESS_PHONE}`
            ),
            // Status badges
            e('div', { className: 'mt-4 flex justify-center gap-2' },
              e('span', {
                className: `px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-tighter ${status === 'CONNECTED' ? 'bg-green-500/20 text-green-400 border border-green-500/30' :
                  status === 'CONNECTING' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30 animate-pulse' :
                    'bg-white/5 text-gray-500 border border-white/10'
                  }`
              }, status),
              status === 'CONNECTED' && e('span', {
                className: `px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-tighter transition-all duration-300 ${isSpeaking ? 'bg-sky-500 text-white animate-pulse' : 'bg-white/5 text-gray-500 opacity-50'
                  }`
              }, isSpeaking ? 'Audio Transmitting' : 'Silence (VAD Active)')
            )
          ),

          // Error display
          error && e('div', { className: 'mb-8 glass border-red-500/30 bg-red-500/10 p-4 rounded-2xl flex items-start gap-4 text-left' },
            e('div', { className: 'bg-red-500 text-white p-2 rounded-lg text-xs leading-none mt-1' },
              e('i', { className: 'fas fa-exclamation-triangle' })
            ),
            e('div', { className: 'flex-1' },
              e('p', { className: 'text-red-200 text-sm font-medium leading-relaxed' }, error)
            )
          ),

          // Main grid
          e('div', { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6' },
            // Left column - controls and transcript
            e('div', { className: 'lg:col-span-8 space-y-6' },
              // Mic button area
              e('div', { className: 'glass rounded-[2rem] p-12 flex flex-col items-center justify-center text-center relative overflow-hidden group' },
                e('button', {
                  onClick: status === 'CONNECTED' ? stop : start,
                  disabled: status === 'CONNECTING',
                  className: `relative w-32 h-32 rounded-full flex items-center justify-center transition-all duration-500 ${status === 'CONNECTED'
                    ? (isSpeaking ? 'bg-sky-500 mic-active scale-110 shadow-[0_0_60px_rgba(14,165,233,0.5)]' : 'bg-sky-900/50 border-2 border-sky-500/30')
                    : 'bg-white/5 hover:bg-white/10 border border-white/10 shadow-2xl'
                    }`
                },
                  e('i', { className: `fas fa-microphone text-3xl transition-transform ${isSpeaking ? 'scale-110 text-white' : (status === 'CONNECTED' ? 'text-sky-400' : 'text-gray-600')}` })
                ),
                e('div', { className: 'mt-8 space-y-2 text-center' },
                  e('h3', { className: 'text-xl font-bold tracking-tight' },
                    status === 'CONNECTED' ? (isSpeaking ? 'Assistant is listening...' : 'Waiting for voice...') :
                      status === 'CONNECTING' ? 'Establishing secure link...' : 'Ready to start?'
                  ),
                  e('p', { className: 'text-gray-500 text-sm font-medium' },
                    status === 'CONNECTED' ? (isSpeaking ? 'Sending audio to Gemini...' : 'VAD is saving your API quota by ignoring silence') :
                      status === 'CONNECTING' ? "Connecting to Daniel's AI Infrastructure..." : 'Click the microphone to begin your triage call'
                  ),
                  status === 'CONNECTED' && e('p', { className: 'text-xs text-gray-400 mt-2' },
                    `Mic level: ${rms.toFixed(3)} — speak clearly if this stays near 0`
                  )
                )
              ),

              // Transcript area
              e('div', { className: 'glass rounded-3xl p-6 h-[400px] flex flex-col text-left' },
                e('div', { className: 'flex items-center justify-between mb-4 px-2' },
                  e('h3', { className: 'text-xs font-black uppercase tracking-widest text-sky-500 flex items-center gap-2' },
                    e('i', { className: 'fas fa-comment-dots text-[10px]' }), ' Live Transcript'
                  ),
                  e('div', { className: `w-2 h-2 rounded-full ${isSpeaking ? 'bg-sky-500 animate-pulse' : 'bg-gray-700'}` })
                ),
                e('div', { className: 'flex-1 overflow-y-auto space-y-4 pr-2 custom-scrollbar' },
                  transcript.length === 0
                    ? e('div', { className: 'h-full flex flex-col items-center justify-center text-center opacity-30 select-none' },
                      e('i', { className: 'fas fa-terminal text-4xl mb-4' }),
                      e('p', { className: 'text-xs font-bold uppercase tracking-tighter' }, 'System awaiting input...')
                    )
                    : transcript.map((msg, i) =>
                      e('div', { key: i, className: `flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}` },
                        e('div', { className: 'flex items-center gap-2 mb-1 px-2' },
                          e('span', { className: 'text-[10px] font-black uppercase tracking-widest opacity-40' },
                            msg.role === 'user' ? 'You' : 'Concierge'
                          ),
                          e('span', { className: 'text-[9px] opacity-20 font-medium italic' }, msg.time)
                        ),
                        e('div', {
                          className: `max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${msg.role === 'user'
                            ? 'bg-sky-500/10 text-sky-100 border border-sky-500/20 rounded-tr-none'
                            : 'bg-white/5 text-gray-200 border border-white/10 rounded-tl-none font-medium'
                            }`
                        }, msg.text)
                      )
                    )
                )
              )
            ),

            // Right column - form
            e('div', { className: 'lg:col-span-4 bg-[#0d1117]/50 rounded-[2rem] border border-white/5 p-8 flex flex-col h-full overflow-hidden shadow-2xl text-left' },
              e('h3', { className: 'text-xs font-black uppercase tracking-[0.2em] text-gray-500 mb-8 flex items-center gap-2' },
                e('i', { className: 'fas fa-clipboard-list' }), ' Triage Intake'
              ),

              e('div', { className: 'flex-1 overflow-y-auto pr-2 custom-scrollbar space-y-6' },
                // Client Name
                e('div', { className: 'space-y-1' },
                  e('label', { className: 'text-[10px] font-bold uppercase tracking-widest text-gray-600' }, 'Client Name'),
                  e('input', {
                    type: 'text',
                    value: formData.clientName,
                    onChange: (ev) => setFormData(prev => ({ ...prev, clientName: ev.target.value })),
                    className: 'w-full bg-white/5 border border-white/5 focus:border-sky-500/50 focus:bg-white/10 rounded-xl px-4 py-3 text-sm transition-all outline-none',
                    placeholder: 'Awaiting name...'
                  })
                ),

                // Phone
                e('div', { className: 'space-y-1' },
                  e('label', { className: 'text-[10px] font-bold uppercase tracking-widest text-gray-600' }, 'Phone'),
                  e('input', {
                    type: 'tel',
                    value: formData.phone,
                    onChange: (ev) => setFormData(prev => ({ ...prev, phone: ev.target.value })),
                    className: 'w-full bg-white/5 border border-white/5 focus:border-sky-500/50 focus:bg-white/10 rounded-xl px-4 py-3 text-sm transition-all outline-none',
                    placeholder: 'Your phone number...'
                  })
                ),

                // Email
                e('div', { className: 'space-y-1' },
                  e('label', { className: 'text-[10px] font-bold uppercase tracking-widest text-gray-600' }, 'Email (type here for accuracy)'),
                  e('input', {
                    type: 'email',
                    value: formData.email,
                    onChange: (ev) => setFormData(prev => ({ ...prev, email: ev.target.value })),
                    className: 'w-full bg-white/5 border border-white/5 focus:border-sky-500/50 focus:bg-white/10 rounded-xl px-4 py-3 text-sm transition-all outline-none',
                    placeholder: 'your@email.com'
                  })
                ),

                // User Type
                e('div', { className: 'space-y-1' },
                  e('label', { className: 'text-[10px] font-bold uppercase tracking-widest text-gray-600' }, 'User Type'),
                  e('select', {
                    value: formData.userType,
                    onChange: (ev) => setFormData(prev => ({ ...prev, userType: ev.target.value })),
                    className: 'w-full bg-white/5 border border-white/5 focus:border-sky-500/50 focus:bg-white/10 rounded-xl px-4 py-3 text-sm transition-all outline-none appearance-none'
                  },
                    e('option', { value: '' }, 'Select Category...'),
                    e('option', { value: 'Business' }, 'Business Professional'),
                    e('option', { value: 'Personal' }, 'Personal/Home User')
                  )
                ),

                // Business Name
                e('div', { className: 'space-y-1' },
                  e('label', { className: 'text-[10px] font-bold uppercase tracking-widest text-gray-600' }, 'Business Name'),
                  e('input', {
                    type: 'text',
                    value: formData.businessName,
                    onChange: (ev) => setFormData(prev => ({ ...prev, businessName: ev.target.value })),
                    className: 'w-full bg-white/5 border border-white/5 focus:border-sky-500/50 focus:bg-white/10 rounded-xl px-4 py-3 text-sm transition-all outline-none',
                    placeholder: 'If applicable...'
                  })
                ),

                // Priority Level
                e('div', { className: 'space-y-1' },
                  e('label', { className: 'text-[10px] font-bold uppercase tracking-widest text-gray-600' }, 'Priority Level'),
                  e('div', { className: 'grid grid-cols-2 gap-2' },
                    ['Low', 'Medium', 'High', 'Critical'].map(level =>
                      e('button', {
                        key: level,
                        onClick: () => setFormData(prev => ({ ...prev, urgency: level })),
                        className: `py-2 px-1 rounded-lg text-[10px] font-black uppercase tracking-tighter border transition-all ${formData.urgency === level
                          ? 'bg-sky-500 border-sky-400 text-white shadow-lg'
                          : 'bg-white/5 border-white/5 text-gray-500 hover:bg-white/10'
                          }`
                      }, level)
                    )
                  )
                ),

                // Issue Summary
                e('div', { className: 'space-y-1' },
                  e('label', { className: 'text-[10px] font-bold uppercase tracking-widest text-gray-600' }, 'Issue Summary'),
                  e('textarea', {
                    value: formData.summary,
                    onChange: (ev) => setFormData(prev => ({ ...prev, summary: ev.target.value })),
                    className: 'w-full bg-white/5 border border-white/5 focus:border-sky-500/50 focus:bg-white/10 rounded-xl px-4 py-3 text-sm transition-all outline-none h-24 resize-none',
                    placeholder: 'Key problem details...'
                  })
                )
              ),

              // Submit button
              e('button', {
                onClick: handleSubmit,
                disabled: submitted || !formData.clientName,
                className: `mt-8 w-full py-4 rounded-2xl font-black uppercase tracking-widest text-xs transition-all ${submitted
                  ? 'bg-green-500/20 text-green-400 cursor-not-allowed border border-green-500/30'
                  : 'bg-gradient-to-r from-sky-600 to-sky-500 hover:from-sky-500 hover:to-sky-400 text-white shadow-[0_10px_30px_rgba(14,165,233,0.3)] hover:shadow-[0_15px_40px_rgba(14,165,233,0.4)] active:scale-95'
                  }`
              }, submitted ? '✓ Submission Confirmed' : 'Finish & Submit Inquiry')
            )
          )
        )
      );
    };

    const root = document.getElementById('root');
    if (root) {
      ReactDOM.createRoot(root).render(React.createElement(App));
    }
  </script>
</body>

</html>
